# Local dependencies only. Start the Go service separately; no production connection.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: smart_space
      MYSQL_USER: smart_space
      MYSQL_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  emqx:
    image: emqx/emqx:5.3
    ports:
      - "127.0.0.1:1884:1883"
      - "127.0.0.1:18084:18083"
volumes:
  mysql_data:
